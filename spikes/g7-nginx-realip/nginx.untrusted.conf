# G7 스파이크 설정(신뢰 대역을 일부러 다른 대역으로 둔 변형). 작성: AI 초안 (Authorship: G).
worker_processes 1;
events { worker_connections 256; }
http {
    # Funnel → docker-proxy 가 만드는 홉(Docker 네트워크 게이트웨이)만 신뢰한다
    set_real_ip_from 10.99.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;                       # 마지막 값만 채택

    limit_req_zone $binary_remote_addr zone=perip2:1m rate=5r/s;
    limit_req_status 429;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 80;
        large_client_header_buffers 4 16k;
        location / {
            limit_req zone=perip2 burst=5 nodelay;
            proxy_pass http://upstream:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # 주소 헤더 정규화: 클라이언트가 보낸 값은 모두 버리고 realip 가 확정한 주소 하나만 전달한다
            proxy_set_header X-Real-IP "";
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Client-IP $remote_addr;
        }
    }
}
