<section class="section">
  <div class="wrap stack" style="--stack:1.5rem">

      <article class="card entry"><div class="entry-meta"><span class="entry-name">손님-a3f9</span><time class="xs subtle">3분 전</time></div><p class="entry-body">구조 설명이 읽기 편했어요.</p></article>
    </div>

    <div id="v-fb" class="stack" style="--stack:1.25rem" hidden>
      <div class="conn-banner" role="status"><svg class="node node-pending" aria-hidden="true"><use href="#n-pending"/></svg><div><strong>서버를 점검하고 있습니다.</strong><div class="small muted" style="margin-top:.25rem">소개와 아키텍처 페이지는 그대로 볼 수 있어요. 데모 화면은 점검이 끝나면 다시 열립니다.</div></div></div>

        <div class="card disabled-card" aria-disabled="true"><h3>방명록 · 흐름 · 지표</h3><p class="small muted"><span class="badge">점검 중</span></p></div>
